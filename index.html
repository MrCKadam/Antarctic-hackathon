<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antarctic Navigator - Iceberg Tracking & Route Planning</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #050811;
            --panel-bg: rgba(10, 16, 30, 0.94);
            --panel-border: rgba(56, 189, 248, 0.3);
            --accent-cyan: #00f0ff;
            --accent-green: #00ff66;
            --accent-yellow: #ffcc00;
            --accent-red: #ff0055;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body, html { height: 100%; width: 100%; background-color: var(--bg-dark); color: var(--text-main); overflow: hidden; display: flex; flex-direction: column; }

        /* --- SATELLITE TILE CONTRAST FILTER --- */
        #map .leaflet-tile-pane {
            filter: brightness(0.55) contrast(1.35) saturate(1.1);
        }

        /* --- TOP BAR --- */
        header {
            height: 54px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .logo i { color: var(--accent-cyan); font-size: 1.3rem; }
        .team-tag { font-size: 0.75rem; background: rgba(0, 240, 255, 0.15); color: var(--accent-cyan); border: 1px solid var(--panel-border); padding: 2px 8px; border-radius: 4px; }
        
        .header-center { display: flex; align-items: center; gap: 20px; font-size: 0.8rem; }
        .stat-badge { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-badge span { color: var(--accent-cyan); font-weight: 700; }

        .header-right { display: flex; align-items: center; gap: 18px; font-size: 0.85rem; }
        .clock-display { color: var(--accent-cyan); font-family: monospace; font-size: 0.9rem; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 4px; border: 1px solid var(--panel-border); }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--accent-green); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

        /* --- MAIN LAYOUT --- */
        .main-wrapper { flex: 1; display: flex; width: 100%; height: calc(100vh - 54px - 24px); position: relative; }
        .map-section { flex: 7; position: relative; height: 100%; }
        #map { width: 100%; height: 100%; background: #02040a; }

        /* ALERTS FEED */
        .alerts-feed {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 999;
            width: 340px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        .alerts-header { font-size: 0.75rem; font-weight: 700; color: var(--accent-yellow); text-transform: uppercase; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .alert-item { font-size: 0.78rem; color: var(--text-main); padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.08); }

        /* TIME SLIDER */
        .slider-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            width: 420px;
        }
        .slider-overlay label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); white-space: nowrap; }
        .slider-overlay input { flex: 1; accent-color: var(--accent-cyan); cursor: pointer; }
        .slider-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan); min-width: 45px; text-align: right; }

        /* SIDEBAR */
        .sidebar {
            flex: 3;
            min-width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }

        .tabs-header { display: flex; border-bottom: 1px solid var(--panel-border); }
        .tab-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn.active { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.08); }

        .tab-content { flex: 1; overflow-y: auto; padding: 16px; display: none; }
        .tab-content.active { display: block; }

        /* RISK FILTER BUTTONS */
        .filter-bar { display: flex; gap: 6px; margin-bottom: 12px; }
        .filter-btn { flex: 1; padding: 6px; font-size: 0.72rem; font-weight: 700; border-radius: 4px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03); color: var(--text-sub); cursor: pointer; }
        .filter-btn.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(0, 240, 255, 0.15); }

        .iceberg-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .iceberg-card:hover { border-color: var(--accent-cyan); background: rgba(15, 23, 42, 0.95); }
        .berg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .berg-id { font-weight: 700; font-size: 0.9rem; color: #fff; }
        .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }
        .badge-green { background: rgba(0, 255, 102, 0.25); color: var(--accent-green); border: 1px solid var(--accent-green); }
        .badge-yellow { background: rgba(255, 204, 0, 0.25); color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }
        .badge-red { background: rgba(255, 0, 85, 0.25); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .berg-details { font-size: 0.78rem; color: var(--text-sub); display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 6px; }
        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(5, 8, 17, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
        }
        .btn-plan {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }
        .btn-plan:hover { opacity: 0.9; }

        .route-results {
            margin-top: 16px;
            padding: 14px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: none;
        }
        .res-item { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 8px; }
        .res-item span:last-child { font-weight: 700; color: var(--accent-cyan); }

        footer {
            height: 24px;
            background: var(--bg-dark);
            border-top: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 0.72rem;
            color: var(--text-sub);
            z-index: 1000;
        }

        /* POPUP STYLING */
        .leaflet-popup-content-wrapper { background: var(--panel-bg) !important; color: var(--text-main) !important; border: 1px solid var(--accent-cyan); border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .leaflet-popup-tip { background: var(--panel-bg) !important; }
        .popup-card h4 { color: var(--accent-cyan); margin-bottom: 6px; font-size: 0.95rem; }
        .popup-row { font-size: 0.78rem; display: flex; justify-content: space-between; margin-bottom: 3px; gap: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">
                <i class="fa-solid fa-compass-drafting"></i>
                <span>Antarctic Navigator</span>
            </div>
            <span class="team-tag">Polar AI</span>
        </div>

        <div class="header-center">
            <div class="stat-badge">Total Tracked: <span id="stat-total">--</span></div>
            <div class="stat-badge">High Risk: <span id="stat-high-risk" style="color:var(--accent-red)">--</span></div>
            <div class="stat-badge">Avg Speed: <span id="stat-avg-speed">--</span></div>
        </div>

        <div class="header-right">
            <div class="clock-display" id="utc-clock">00:00:00 UTC</div>
            <div class="status-badge">
                <div class="status-dot"></div>
                <span>API Live</span>
            </div>
        </div>
    </header>

    <div class="main-wrapper">
        
        <div class="map-section">
            <div id="map"></div>

            <div class="alerts-feed" id="alerts-feed">
                <div class="alerts-header">
                    <i class="fa-solid fa-triangle-exclamation"></i> Live Navigation Alerts
                </div>
            </div>

            <div class="slider-overlay">
                <label><i class="fa-solid fa-clock-rotate-left"></i> Forecast:</label>
                <input type="range" id="time-slider" min="0" max="48" step="6" value="0">
                <div class="slider-val" id="slider-val">Now</div>
            </div>
        </div>

        <div class="sidebar">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('icebergs')"><i class="fa-solid fa-cubes-stacked"></i> Iceberg List</button>
                <button class="tab-btn" onclick="switchTab('route')"><i class="fa-solid fa-route"></i> Route Planner</button>
            </div>

            <div id="tab-icebergs" class="tab-content active">
                <div class="filter-bar">
                    <button class="filter-btn active" onclick="filterIcebergs('', this)">ALL</button>
                    <button class="filter-btn" onclick="filterIcebergs('red', this)">RED</button>
                    <button class="filter-btn" onclick="filterIcebergs('yellow', this)">YELLOW</button>
                    <button class="filter-btn" onclick="filterIcebergs('green', this)">GREEN</button>
                </div>
                <div id="iceberg-list-container"></div>
            </div>

            <div id="tab-route" class="tab-content">
                <div class="form-group">
                    <label>Start Port</label>
                    <select id="start-port">
                        <option value="palmer">Palmer Station (-64.77, -64.05)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Destination Port</label>
                    <select id="end-port">
                        <option value="rothera">Rothera Research Base (-67.57, -68.12)</option>
                    </select>
                </div>
                <button class="btn-plan" onclick="calculateRoute()">
                    <i class="fa-solid fa-location-arrow"></i> Find Safe Route
                </button>

                <div class="route-results" id="route-results">
                    <div class="res-item"><span>Total Distance:</span> <span id="res-dist">-- NM</span></div>
                    <div class="res-item"><span>Est. Voyage Time:</span> <span id="res-time">-- hrs</span></div>
                    <div class="res-item"><span>Hazard Zones Avoided:</span> <span id="res-avoided">--</span></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div>Status: Connected to FastAPI Backend</div>
        <div>Data: NSIDC, Copernicus Marine Service, GEBCO</div>
    </footer>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';

        let map, icebergLayer, driftPathLayer, routeLayer;
        let currentHours = 0;
        let icebergsData = [];
        let activeRiskFilter = '';

        async function initMap() {
            // World bounds & single frame configuration (No tile repetition)
            map = L.map('map', { 
                zoomControl: false,
                minZoom: 2,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0
            }).setView([-65.2, -63.5], 7);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 12,
                minZoom: 2,
                noWrap: true,
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            driftPathLayer = L.layerGroup().addTo(map);
            routeLayer = L.layerGroup().addTo(map);
            icebergLayer = L.layerGroup().addTo(map);

            startClock();

            // Fetch live API data on load
            await loadStats();
            await loadAlerts();
            await loadIcebergs();
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
            }, 1000);
        }

        // GET /stats
        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE_URL}/stats`);
                if (!res.ok) return;
                const stats = await res.json();
                
                document.getElementById('stat-total').innerText = stats.total_icebergs;
                document.getElementById('stat-high-risk').innerText = stats.high_risk_count;
                document.getElementById('stat-avg-speed').innerText = `${stats.avg_speed_knots} kts`;
            } catch (err) {
                console.error("Error fetching stats:", err);
            }
        }

        // GET /alerts
        async function loadAlerts() {
            try {
                const res = await fetch(`${API_BASE_URL}/alerts`);
                if (!res.ok) return;
                const data = await res.json();

                const container = document.getElementById('alerts-feed');
                container.innerHTML = `
                    <div class="alerts-header">
                        <i class="fa-solid fa-triangle-exclamation"></i> Live Navigation Alerts
                    </div>
                `;

                data.alerts.forEach(alert => {
                    const item = document.createElement('div');
                    item.className = 'alert-item';
                    const icon = alert.severity === 'CRITICAL' ? '⚠️' : '🧊';
                    item.innerHTML = `${icon} ${alert.message}`;
                    container.appendChild(item);
                });
            } catch (err) {
                console.error("Error fetching alerts:", err);
            }
        }

        // GET /icebergs (with optional ?risk= filter)
        async function loadIcebergs(risk = '') {
            try {
                const url = risk ? `${API_BASE_URL}/icebergs?risk=${risk}` : `${API_BASE_URL}/icebergs`;
                const res = await fetch(url);
                if (!res.ok) return;
                icebergsData = await res.json();
                
                renderIcebergs();
                populateIcebergList();
            } catch (err) {
                console.error("Error loading icebergs:", err);
            }
        }

        // GET /icebergs/{id}
        async function selectIceberg(id) {
            try {
                const res = await fetch(`${API_BASE_URL}/icebergs/${id}`);
                if (!res.ok) return;
                const berg = await res.json();
                
                map.flyTo([berg.lat, berg.lng], 8, { duration: 1 });
            } catch (err) {
                console.error("Error fetching single iceberg detail:", err);
            }
        }

        function filterIcebergs(riskLevel, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeRiskFilter = riskLevel;
            loadIcebergs(riskLevel);
        }

        function renderIcebergs() {
            icebergLayer.clearLayers();
            driftPathLayer.clearLayers();

            icebergsData.forEach(berg => {
                const latShift = (currentHours * 0.008) * (berg.direction.includes("N") ? 1 : -1);
                const lngShift = (currentHours * 0.012) * (berg.direction.includes("W") ? -1 : 1);
                const currLat = berg.lat + latShift;
                const currLng = berg.lng + lngShift;

                const colorMap = { green: "#00ff66", yellow: "#ffcc00", red: "#ff0055" };
                const color = colorMap[berg.risk_level] || "#00f0ff";

                // High-visibility dual casing drift paths
                const futureLat = berg.lat + (48 * 0.008) * (berg.direction.includes("N") ? 1 : -1);
                const futureLng = berg.lng + (48 * 0.012) * (berg.direction.includes("W") ? -1 : 1);
                
                L.polyline([[berg.lat, berg.lng], [futureLat, futureLng]], {
                    color: '#000000', weight: 5, opacity: 0.9
                }).addTo(driftPathLayer);

                L.polyline([[berg.lat, berg.lng], [futureLat, futureLng]], {
                    color: color, weight: 2.5, dashArray: '4, 6', opacity: 1.0
                }).addTo(driftPathLayer);

                // Iceberg Circle Marker with heavy black outline border
                const marker = L.circleMarker([currLat, currLng], {
                    radius: 9,
                    fillColor: color,
                    color: "#000000",
                    weight: 3,
                    fillOpacity: 1.0
                });

                marker.bindPopup(`
                    <div class="popup-card">
                        <h4>${berg.id} Details</h4>
                        <div class="popup-row"><span>Risk Score:</span> <b style="color:${color}">${berg.risk_score}% (${berg.risk_level.toUpperCase()})</b></div>
                        <div class="popup-row"><span>Position:</span> <span>${currLat.toFixed(2)}, ${currLng.toFixed(2)}</span></div>
                        <div class="popup-row"><span>Size:</span> <span>${berg.size_km2} km²</span></div>
                        <div class="popup-row"><span>Speed:</span> <span>${berg.speed_knots} kts (${berg.direction})</span></div>
                    </div>
                `);

                icebergLayer.addLayer(marker);
            });
        }

        function populateIcebergList() {
            const container = document.getElementById('iceberg-list-container');
            container.innerHTML = '';

            icebergsData.forEach(berg => {
                const card = document.createElement('div');
                card.className = 'iceberg-card';
                card.onclick = () => selectIceberg(berg.id);
                card.innerHTML = `
                    <div class="berg-header">
                        <span class="berg-id">${berg.id}</span>
                        <span class="badge badge-${berg.risk_level}">${berg.risk_level} (${berg.risk_score}%)</span>
                    </div>
                    <div class="berg-details">
                        <span>Size: ${berg.size_km2} km²</span>
                        <span>Speed: ${berg.speed_knots} kts</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if(tabName === 'icebergs') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-icebergs').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-route').classList.add('active');
            }
        }

        document.getElementById('time-slider').addEventListener('input', (e) => {
            currentHours = parseInt(e.target.value);
            document.getElementById('slider-val').innerText = currentHours === 0 ? "Now" : `+${currentHours}h`;
            renderIcebergs();
        });

        // POST /route
        async function calculateRoute() {
            routeLayer.clearLayers();

            const payload = {
                start: { lat: -64.77, lng: -64.05 },
                end: { lat: -67.57, lng: -68.12 }
            };

            try {
                const res = await fetch(`${API_BASE_URL}/route`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Route calculation failed');
                const data = await res.json();

                // Render Route Line with high contrast casing
                L.polyline(data.path, { color: '#000000', weight: 8, opacity: 0.9 }).addTo(routeLayer);
                const polyline = L.polyline(data.path, { color: '#00f0ff', weight: 4, opacity: 1.0 }).addTo(routeLayer);
                
                map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

                // Display Results
                document.getElementById('route-results').style.display = 'block';
                document.getElementById('res-dist').innerText = `${data.distance_nm} NM`;
                document.getElementById('res-time').innerText = `${data.est_hours} hrs`;
                document.getElementById('res-avoided').innerText = `${data.hazards_avoided} Zones`;

            } catch (err) {
                console.error("Error calculating route:", err);
            }
        }

        window.onload = initMap;
    </script>
</body>
</html>
